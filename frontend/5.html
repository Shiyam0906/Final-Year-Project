<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Camera Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            padding-top: 20px;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            flex-direction: column;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        p {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="sidebar">Visual Interface</div>
    <div class="main-content">
        <h1>ESP32 Camera</h1>
        <p>Connecting to ESP32 camera, please wait...</p>
    </div>

    <script>
        window.onload = function () {
            fetch("http://localhost:5000/ESPcamera")
                .then(response => response.json())
                .then(data => {
                    if (data.status === "connected") {
                        window.location.href = "6.html";
                    } else {
                        showMessage("Camera not connected. Please check the connection.");
                    }
                })
                .catch(error => {
                    showMessage("Error connecting to camera: " + error.message);
                });

            function showMessage(msg) {
                const p = document.querySelector(".main-content p");
                if (p) {
                    p.textContent = msg;
                    p.style.color = "red";
                }
            }
        };
    </script>
</body>
</html>
