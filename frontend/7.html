<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            padding-top: 20px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            text-align: center;
            position: relative;
        }

        .input-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-container input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .input-container button {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .input-container button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>
    <div class="sidebar">Visual Interface</div>
    <div class="main-content">
        <h1>Mobile Camera</h1>
        <p>Please enter the IP address for your mobile camera</p>
        <div class="input-container">
            <input type="text" placeholder="Enter IP address..." id="ipAddress">
            <button onclick="submitIP()">Submit</button>
        </div>
    </div>

    <script>
        function submitIP() {
            // You can capture the IP value here if needed
            const ip = document.getElementById('ipAddress').value;
            window.location.href = "8.html";
        }
    </script>
</body>

</html>
